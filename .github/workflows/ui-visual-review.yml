name: UI visual review
on:
  push:
    branches: [feat/ui-meta-connectors, feat/prism-acquisition-os]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install pinned headless browser (CI only)
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Validate UI in a disposable, localhost-only laboratory session
        run: node --experimental-sqlite scripts/ui-smoke.mjs
      - name: Capture responsive review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ConvOS-UI-Review-Screenshots
          path: ui-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
