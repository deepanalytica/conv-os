name: Fullstack CI
on:
  push:
    branches: [main, docs/praxios-meta-harness-foundation, feat/acquisition-os, feat/assurance-gates, feat/ui-meta-connectors, feat/prism-acquisition-os]
  pull_request:
    branches: [main, feat/acquisition-os, docs/praxios-meta-harness-foundation]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Validate JavaScript and run automated tests
        run: |
          npm run check
          node --check public/landing/landing.js
          node --check public/theme.js
      - name: Validate static assets and no production secrets
        run: |
          test -f public/index.html
          test -f public/app.js
          test -f public/crm-ui.js
          test -f public/crm-ui.css
          test -f public/login.html
          test -f public/login.css
          test -f public/login.js
          test -f src/security.js
          test -f src/followups.js
          test -f src/commercial.js
          test -f public/commercial-ui.js
          test -f src/consent.js
          test -f public/privacy-ui.js
          test -f public/integrations-ui.js
          test -f public/workspace-v1.css
          test -f src/integrations.js
          test -f src/channel-events.js
          test -f src/ontology.js
          test -f src/operating-system.js
          test -f public/insights-ui.js
          test -f public/orchestration-ui.js
          test -f public/prism-os.css
          test -f scripts/pull-meta-metadata.mjs
          test -f edge/meta-gateway/migrations/0001_accounts.sql
          test -f edge/meta-gateway/src/index.js
          test -f scripts/backup-local.mjs
          test -f scripts/restore-local.mjs
          test -f scripts/secret-input.mjs
          test -f scripts/setup-local.mjs
          test -f public/styles.css
          test -f public/premium.css
          test -f public/landing/index.html
          test -f public/landing/landing.css
          test -f public/landing/landing.js
          test -f public/theme.css
          test -f public/theme.js
          test -f public/assets/hub-dark.svg
          test -f public/assets/hub-light.svg
          test -f public/assets/flow-dark.svg
          test -f public/assets/flow-light.svg
          test -f public/assets/icons.svg
          python3 -c 'import xml.etree.ElementTree as ET; from pathlib import Path; [ET.parse(x) for x in Path("public/assets").glob("*.svg")]; print("SVG assets valid")'
          if grep -R -E -- '-----BEGIN (RSA|OPENSSH|PRIVATE) KEY-----' src public; then
            echo 'Potential secret detected'
            exit 1
          fi
