name: Fullstack CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Validate JavaScript and run automated tests
        run: |
          npm run check
          node --check public/landing/landing.js
          node --check public/theme.js
      - name: Validate static assets and no production secrets
        run: |
          test -f public/index.html
          test -f public/app.js
          test -f public/crm-ui.js
          test -f public/crm-ui.css
          test -f public/styles.css
          test -f public/premium.css
          test -f public/landing/index.html
          test -f public/landing/landing.css
          test -f public/landing/landing.js
          test -f public/theme.css
          test -f public/theme.js
          test -f public/assets/hub-dark.svg
          test -f public/assets/hub-light.svg
          test -f public/assets/flow-dark.svg
          test -f public/assets/flow-light.svg
          test -f public/assets/icons.svg
          python3 -c 'import xml.etree.ElementTree as ET; from pathlib import Path; [ET.parse(x) for x in Path("public/assets").glob("*.svg")]; print("SVG assets valid")'
          if grep -R -E -- '-----BEGIN (RSA|OPENSSH|PRIVATE) KEY-----' src public; then
            echo 'Potential secret detected'
            exit 1
          fi
