<div id="toast" role="status" aria-live="polite"></div><input type="file" id="importInput" accept=".csv,.json,text/csv,application/json" hidden><script>/** Deep Radar — independent, clean-room opportunity scoring. No Dropkiller or Dropi private APIs. */
const VERSION = '0.1.0';
const BUDGET_DEFAULT = 20000;
const CLP = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-CL');
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, Number.isFinite(Number(n)) ? Number(n) : lo));
const asMoney = n => Math.max(0, Math.round(Number(n) || 0));
const asPercent = n => clamp(n, 0, 100);
const safeUrl = value => { try { let u=new URL(value); return ['https:','http:'].includes(u.protocol) ? u.href : ''; } catch { return ''; } };

function economics(product, settings={}) {
  const price=asMoney(product.price), cost=asMoney(product.cost), shipping=asMoney(product.shipping), fee=asMoney(product.fee);
  const cpa=asMoney(product.cpa), rejectRate=asPercent(product.rejectRate), rejectCost=asMoney(product.rejectCost);
  const taxReserve=asMoney(product.taxReserve), reserve=rejectRate/100*rejectCost;
  const beforeAds=price-cost-shipping-fee-taxReserve-reserve;
  const contribution=beforeAds-cpa;
  const limitCPA=Math.max(0,beforeAds);
  const targetContribution=asMoney(settings.targetContribution ?? 8000);
  const cpaTarget=Math.max(0,beforeAds-targetContribution);
  const marginPct=price>0?100*contribution/price:0;
  return {price,cost,shipping,fee,cpa,rejectRate,rejectCost,taxReserve,expectedRejectCost:reserve,beforeAds,contribution,limitCPA,cpaTarget,marginPct,targetContribution};
}
function scoreProduct(p) {
  const e=economics(p), marginScore=clamp((e.beforeAds/14000)*30,0,30);
  const demandScore=clamp(p.demand,0,5)*5, painScore=clamp(p.pain,0,5)*3;
  const competitionScore=clamp(p.competition,0,5)*3, logisticsScore=clamp(p.logistics,0,5)*3;
  const raw=marginScore+demandScore+painScore+competitionScore+logisticsScore;
  const evidence=clamp(p.evidence,0,5), confidence=Math.round(evidence*20);
  // Missing evidence cannot look like a verified winner. This is a prioritization heuristic, not sales prediction.
  const score=Math.round(raw*(0.55+evidence*0.09));
  const verdict=e.contribution<0 ? 'No rentable' : evidence<3 ? 'Investigar' : score>=75 && e.contribution>=8000 ? 'Prioritario' : score>=55 ? 'Validar' : 'Revisar';
  return {score:clamp(score,0,100),raw:Math.round(raw),confidence,verdict,breakdown:{margin:Math.round(marginScore),demand:demandScore,pain:painScore,competition:competitionScore,logistics:logisticsScore}, economics:e};
}
const DEFAULT_SETTINGS={budget:20000,targetContribution:8000};
const SEED_PRODUCTS=[
  {id:'demo-57111',name:'Bolsillo magnético de gimnasio',category:'Fitness',problem:'Evita dejar teléfono, llaves y botella en el suelo durante el entrenamiento.',source:'Dropi · catálogo referido',sku:'57111',cost:6100,price:22990,shipping:5000,fee:1000,cpa:0,rejectRate:10,rejectCost:3000,taxReserve:0,demand:2,pain:4,competition:2,logistics:4,evidence:1,status:'investigacion',notes:'Precio y producto referenciales. Validar ficha, stock, despacho y materiales en tu cuenta Dropi. No hay ventas verificadas.',sourceUrl:'https://dropi.co/cl',adUrl:'',competitorUrl:'',isDemo:true,updatedAt:'2026-10-29'},
  {id:'demo-57176',name:'Ducha portátil recargable',category:'Outdoor',problem:'Permite ducharse donde no hay instalación fija de agua.',source:'Dropi · catálogo referido',sku:'57176',cost:10500,price:24990,shipping:5000,fee:1000,cpa:0,rejectRate:10,rejectCost:3000,taxReserve:0,demand:1,pain:4,competition:1,logistics:2,evidence:1,status:'investigacion',notes:'Validar batería, autonomía, impermeabilidad, mercado y garantía. Datos referenciales.',sourceUrl:'https://dropi.co/cl',adUrl:'',competitorUrl:'',isDemo:true,updatedAt:'2026-10-29'},
  {id:'demo-56690',name:'Organizador colgante para viajes',category:'Hogar',problem:'Organiza accesorios y cosméticos cuando no hay superficies limpias o suficientes.',source:'Dropi · catálogo referido',sku:'56690',cost:8500,price:19990,shipping:5000,fee:1000,cpa:0,rejectRate:10,rejectCost:3000,taxReserve:0,demand:1,pain:3,competition:1,logistics:5,evidence:1,status:'investigacion',notes:'Comprobar competencia: puede ser difícil defender precio.',sourceUrl:'https://dropi.co/cl',adUrl:'',competitorUrl:'',isDemo:true,updatedAt:'2026-10-29'},
  {id:'demo-57099',name:'Adaptador cortador para taladro',category:'Herramientas',problem:'Convierte un taladro compatible en herramienta de corte para determinados materiales.',source:'Dropi · catálogo referido',sku:'57099',cost:5300,price:17990,shipping:5000,fee:1000,cpa:0,rejectRate:10,rejectCost:3000,taxReserve:0,demand:1,pain:3,competition:1,logistics:3,evidence:1,status:'investigacion',notes:'Requiere validar compatibilidad, uso seguro, prestaciones y competencia.',sourceUrl:'https://dropi.co/cl',adUrl:'',competitorUrl:'',isDemo:true,updatedAt:'2026-10-29'}
];
const blankProduct=()=>({id:'p-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name:'',category:'Otro',problem:'',source:'Ingreso manual',sku:'',cost:0,price:0,shipping:5000,fee:1000,cpa:0,rejectRate:10,rejectCost:3000,taxReserve:0,demand:0,pain:0,competition:0,logistics:3,evidence:0,status:'investigacion',notes:'',sourceUrl:'',adUrl:'',competitorUrl:'',isDemo:false,updatedAt:new Date().toISOString().slice(0,10)});
const STATUSES=[['investigacion','Por investigar'],['validacion','Validando'],['aprobado','Aprobado'],['descartado','Descartado']];
function csvEscape(value){const s=String(value??'');const safe=/^[=+@\-]/.test(s) && !/^\-?\d+(\.\d+)?$/.test(s)?"'"+s:s;return /[",\n\r]/.test(safe)?'"'+safe.replaceAll('"','""')+'"':safe;}
function exportCSV(products){const cols=['id','name','category','problem','source','sku','cost','price','shipping','fee','cpa','rejectRate','rejectCost','taxReserve','demand','pain','competition','logistics','evidence','status','notes','sourceUrl','adUrl','competitorUrl','updatedAt'];return '\uFEFF'+[cols.join(','),...products.map(p=>cols.map(c=>csvEscape(p[c])).join(','))].join('\r\n');}
function parseCSV(src){const result=[];let cell='',row=[],quote=false;const s=String(src||'').replace(/^\uFEFF/,'');for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(quote&&s[i+1]==='"'){cell+='"';i++}else quote=!quote;}else if(c===','&&!quote){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cell);if(row.some(Boolean))result.push(row);row=[];cell='';}else cell+=c;}row.push(cell);if(row.some(Boolean))result.push(row);if(quote)throw Error('CSV con comillas sin cerrar');return result;}
function importCSV(text){const rows=parseCSV(text);if(rows.length<2)throw Error('CSV sin filas de productos');const cols=rows[0].map(x=>x.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));const lookup=(o,names)=>{for(const n of names){let i=cols.indexOf(n);if(i>=0)return o[i];}return '';};const items=[];for(let ri=1;ri<rows.length;ri++){const row=rows[ri];const name=lookup(row,['name','nombre','producto','product','titulo']);if(!name)continue;const p=blankProduct();p.name=name.slice(0,150);p.category=lookup(row,['category','categoria'])||'Otro';p.problem=lookup(row,['problem','problema'])||'';p.sku=lookup(row,['sku','codigo','id dropi','id_dropi'])||'';p.source=lookup(row,['source','fuente','proveedor'])||'CSV importado';for(const [k,aliases] of Object.entries({cost:['cost','costo','precio proveedor','precio_proveedor'],price:['price','precio','precio venta','precio_venta'],shipping:['shipping','envio','flete'],fee:['fee','comision','comision plataforma'],cpa:['cpa','publicidad'],demand:['demand','demanda'],pain:['pain','dolor'],competition:['competition','competencia'],logistics:['logistics','logistica'],evidence:['evidence','evidencia'],rejectRate:['rejectrate','rechazo'],rejectCost:['rejectcost','costo rechazo'],taxReserve:['taxreserve','reserva tributaria']})){const v=lookup(row,aliases);if(v!==''&&Number.isFinite(Number(v)))p[k]=asMoney(v);}const status=lookup(row,['status','estado']);if(STATUSES.some(x=>x[0]===status))p.status=status;for(const k of ['notes','sourceUrl','adUrl','competitorUrl']){const val=lookup(row,[k.toLowerCase()]);if(val)p[k]=k.endsWith('Url')?safeUrl(val):val;}p.isDemo=false;items.push(p);}if(!items.length)throw Error('No se encontraron productos. CSV debe tener columna nombre/name.');return items.slice(0,2000);}
function metaSearchUrl(term){const q=new URLSearchParams({active_status:'active',ad_type:'all',country:'CL',q:term,search_type:'keyword_unordered'});return 'https://www.facebook.com/ads/library/?'+q.toString();}


const $=q=>document.querySelector(q);
const KEY='deep-radar-v1', ICON={radar:'ic-radar',products:'ic-box',ads:'ic-ads',stores:'ic-layers',playbook:'ic-flask',settings:'ic-settings'};
const MENU=[['radar','Visión general','radar'],['products','Radar de productos','products'],['ads','Explorador de anuncios','ads'],['stores','Competidores','stores'],['playbook','Laboratorio de ofertas','playbook'],['settings','Configuración','settings']];
const svg=k=>`<svg aria-hidden="true"><use href="#${k}"/></svg>`;
const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const glyph=category=>({'Fitness':'◈','Outdoor':'◉','Hogar':'⌂','Herramientas':'✦','Mascotas':'♟','Tecnología':'⬡','Belleza':'✳','Salud':'✚'})[category]||'◇';
const getStatus=p=>STATUSES.find(s=>s[0]===p.status)?.[1]||'Por investigar';
const fmtPct=n=>Number(n||0).toFixed(1).replace('.',',')+'%';
const initial=()=>({products:structuredClone(SEED_PRODUCTS),settings:{...DEFAULT_SETTINGS}});
const load=()=>{try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.products)&&saved.settings)return {products:saved.products.map(x=>({...blankProduct(),...x})).slice(0,3000),settings:{...DEFAULT_SETTINGS,...saved.settings}};}catch{}return initial();};
let db=load();let state={page:'radar',selected:null,search:'',category:'all',status:'all',sort:'score',modalId:null};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));}catch{toast('No se pudo guardar: almacenamiento local restringido. Exporta tus datos.');}};
const products=()=>db.products.map(p=>({...p,metrics:scoreProduct(p)}));
const ranked=()=>products().sort((a,b)=>b.metrics.score-a.metrics.score);
const verified=p=>!p.isDemo&&Number(p.evidence)>=3;
let toastTimer=null;function toast(message){const t=$('#toast');t.textContent=message;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',4600);}
function setPage(page){state.page=page;state.selected=null;state.search='';state.category='all';state.status='all';state.sort='score';$('#sidebar').classList.remove('open');render();}
function renderNav(){const counts={products:db.products.length};$('#nav').innerHTML=MENU.map(([id,title,ic])=>`<button class="nav-item ${id===state.page?'active':''}" data-nav="${id}">${svg(ICON[ic])}<span>${h(title)}</span>${counts[id]!==undefined?`<span class="count">${counts[id]}</span>`:''}</button>`).join('');$('#sidebarBudget').textContent=CLP(db.settings.budget??BUDGET_DEFAULT);}
function header(eyebrow,title,desc,accessory=''){return `<div class="page-header"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${accessory}</div>`;}
function demoBanner(){return `<div class="demo-banner">${svg('ic-alert')}<div><strong>Laboratorio / datos de ejemplo.</strong> Los productos iniciales tienen precios referenciales. No existe una conexión en vivo con Dropi, Meta ni Dropkiller. Ninguna venta fue verificada.</div><button data-action="reset">Restablecer</button></div>`;}
function productTag(p){return `<span class="status-tag ${h(p.status)}">${h(getStatus(p))}</span>`;}
function scoreBadge(score){return `<span class="score-tag ${score>=70?'':score>=45?'mid':'low'}"><span class="score-indicator"></span>${score}<span style="font-weight:400;color:#7590a0">/100</span></span>`;}
function productCells(p){const e=p.metrics.economics;return `<tr class="product-row" tabindex="0" role="button" aria-label="Abrir ${h(p.name)}" data-detail="${h(p.id)}"><td><div class="product-id"><div class="product-glyph">${glyph(p.category)}</div><div><strong>${h(p.name)} ${p.isDemo?'<span class="chip demo">DEMO</span>':''}</strong><small>${h(p.category)} ${p.sku?' · ID '+h(p.sku):''}</small></div></div></td><td>${scoreBadge(p.metrics.score)}<small>${p.metrics.confidence}% evidencia</small></td><td>${CLP(p.cost)}</td><td>${CLP(p.price)}</td><td class="${e.contribution>=0?'money-pos':'money-neg'}">${CLP(e.contribution)}</td><td>${productTag(p)}</td><td><button class="primary-link" data-edit="${h(p.id)}">Editar ${svg('ic-arrow')}</button></td></tr>`;}
function table(items,limit){let arr=limit?items.slice(0,limit):items;return `<div class="table-scroll"><table><thead><tr><th>PRODUCTO</th><th>RADAR SCORE</th><th>COSTO</th><th>PRECIO</th><th>SALDO / VENTA*</th><th>ETAPA</th><th></th></tr></thead><tbody>${arr.length?arr.map(productCells).join(''):`<tr><td colspan="7"><div class="empty-state"><h3>Sin productos que coincidan</h3><p>Prueba otro filtro o añade una oportunidad propia.</p></div></td></tr>`}</tbody></table></div>`;}
function metricsCards(){const arr=products();const viable=arr.filter(p=>p.metrics.economics.contribution>=db.settings.targetContribution).length;const verifiedCount=arr.filter(verified).length;const top=ranked()[0];return `<section class="metrics"><article class="metric featured"><div class="metric-title">OPORTUNIDADES RASTREADAS ${svg('ic-radar')}</div><div class="metric-value">${arr.length.toString().padStart(2,'0')}</div><div class="metric-note">${arr.filter(p=>p.isDemo).length} referenciales / ${arr.filter(p=>!p.isDemo).length} ingresadas</div></article><article class="metric"><div class="metric-title">CANDIDATOS POR MARGEN ${svg('ic-chart')}</div><div class="metric-value green">${viable.toString().padStart(2,'0')}</div><div class="metric-note">Saldo ≥ ${CLP(db.settings.targetContribution)} <strong>antes de impuestos no provisionados</strong></div></article><article class="metric"><div class="metric-title">VALIDADOS CON EVIDENCIA ${svg('ic-shield')}</div><div class="metric-value">${verifiedCount.toString().padStart(2,'0')}</div><div class="metric-note">Ingresados por ti con evidencia ≥ 3/5</div></article><article class="metric"><div class="metric-title">MAYOR SCORE ACTUAL ${svg('ic-up')}</div><div class="metric-value">${top?top.metrics.score:'—'}<span style="font-size:14px;color:#7694a2"> / 100</span></div><div class="metric-note">${h(top?.name||'Añade un producto')}</div></article></section>`;}
function overview(){const arr=ranked();return header('INTELLIGENCE / OVERVIEW','Tu ventaja empieza con los datos','Identifica oportunidades, calcula el riesgo y decide qué producto merece una prueba.',`<span class="date-indicator">${svg('ic-clock')} ACTUALIZACIÓN MANUAL · ${new Intl.DateTimeFormat('es-CL',{day:'2-digit',month:'short',year:'numeric'}).format(new Date())}</span>`)+demoBanner()+metricsCards()+`<div class="two-cols"><section class="panel"><div class="panel-head"><div><h2>Oportunidades bajo observación</h2><p>Ordenadas por potencial y calidad de evidencia</p></div><button class="primary-link" data-nav="products">Ver todos ${svg('ic-arrow')}</button></div>${table(arr,5)}<div style="padding:12px 19px;color:#7890a2;font-size:9px">* Saldo estimado tras costos ingresados, publicidad prevista y riesgo de rechazo; no utilidad neta.</div></section><aside class="panel"><div class="panel-head"><div><h2>Centro de señales</h2><p>Próximos pasos de investigación</p></div><span class="chip">EN CURSO</span></div><div class="panel-body"><div class="signal-items"><div class="signal"><div class="signal-icon">${svg('ic-search')}</div><div><strong>Investigar anuncios reales</strong><p>Busca creatividades activas en Chile. Registra enlaces y fechas, no supongas ROAS.</p><a class="help-link" href="${metaSearchUrl('bolsillo magnetico gimnasio')}" target="_blank" rel="noopener noreferrer">Abrir biblioteca Meta ${svg('ic-external')}</a></div></div><div class="signal"><div class="signal-icon orange">${svg('ic-box')}</div><div><strong>Comprobar precios en Dropi</strong><p>Valida costo proveedor, stock y flete desde tu propia cuenta.</p><a class="help-link" href="https://dropi.co/cl" target="_blank" rel="noopener noreferrer">Acceder a Dropi ${svg('ic-external')}</a></div></div><div class="signal"><div class="signal-icon blue">${svg('ic-flask')}</div><div><strong>Definir umbral de prueba</strong><p>Capital disponible ${CLP(db.settings.budget)}. No gastar en herramientas antes de validar demanda.</p><button class="primary-link" data-nav="playbook">Ver laboratorio ${svg('ic-arrow')}</button></div></div></div><div class="signal-footer"><strong>Regla del radar:</strong> un anuncio activo no demuestra ventas. Solo una prueba de pedidos entregados confirma rentabilidad.</div></div></aside></div><div class="footer-note">DEEP RADAR ${VERSION} · MODELO HEURÍSTICO TRANSPARENTE · SIN DATOS PRIVADOS DE TERCEROS</div>`;}
function filtered(){let a=products();const needle=state.search.trim().toLowerCase();if(needle)a=a.filter(x=>[x.name,x.category,x.problem,x.sku,x.notes].some(z=>String(z||'').toLowerCase().includes(needle)));if(state.category!=='all')a=a.filter(x=>x.category===state.category);if(state.status!=='all')a=a.filter(x=>x.status===state.status);a.sort((a,b)=>state.sort==='score'?b.metrics.score-a.metrics.score:state.sort==='profit'?b.metrics.economics.contribution-a.metrics.economics.contribution:state.sort==='price'?a.price-b.price:a.name.localeCompare(b.name,'es'));return a;}
function productExplorer(){let cats=[...new Set(db.products.map(x=>x.category))].sort();const a=filtered();return header('DISCOVERY / PRODUCT FINDER','Radar de productos','Clasifica, filtra y evalúa con cifras introducidas o verificadas por ti.')+demoBanner()+`<div class="toolbar"><div class="search-field">${svg('ic-search')}<input id="searchProducts" type="search" placeholder="Buscar productos, problemas o códigos..." value="${h(state.search)}" aria-label="Buscar productos"></div><div class="filters"><select id="filterCat" aria-label="Categoría"><option value="all">Todas las categorías</option>${cats.map(x=>`<option ${state.category===x?'selected':''} value="${h(x)}">${h(x)}</option>`).join('')}</select><select id="filterStatus" aria-label="Estado"><option value="all">Todos los estados</option>${STATUSES.map(([id,name])=>`<option ${state.status===id?'selected':''} value="${id}">${name}</option>`).join('')}</select><select id="sortProducts" aria-label="Ordenar"><option value="score" ${state.sort==='score'?'selected':''}>Mayor radar score</option><option value="profit" ${state.sort==='profit'?'selected':''}>Mayor saldo</option><option value="price" ${state.sort==='price'?'selected':''}>Menor precio</option><option value="name" ${state.sort==='name'?'selected':''}>Nombre A–Z</option></select></div></div><div class="panel"><div class="panel-head"><div><h2>Inventario de hipótesis</h2><p>Se muestran <strong id="resultCount">${a.length}</strong> oportunidades. No es una clasificación de ventas reales.</p></div><button class="primary-link" data-action="import">Importar CSV ${svg('ic-arrow')}</button></div><div id="productsTable">${table(a)}</div></div><div class="footer-note">PUNTUACIÓN = MARGEN 30 + DEMANDA 25 + PROBLEMA 15 + COMPETENCIA 15 + LOGÍSTICA 15, AJUSTADA POR EVIDENCIA.</div>`;}
function detail(product){if(!product)return setPage('products');const p={...product,metrics:scoreProduct(product)};const e=p.metrics.economics,b=p.metrics.breakdown;const breakdown=[['Margen potencial',b.margin,30],['Señales de demanda',b.demand,25],['Problema específico',b.pain,15],['Poca competencia',b.competition,15],['Facilidad logística',b.logistics,15]];return header('ANÁLISIS / PRODUCTO','Ficha de oportunidad','Una decisión defendible exige evidencia, margen y ejecución logística.')+`<button class="ghost-button" data-nav="products" style="margin-bottom:18px">← Volver al radar</button><div class="detail-grid"><section class="panel"><div class="panel-body"><div class="detail-top"><div class="product-glyph">${glyph(p.category)}</div><div style="flex:1"><div class="eyebrow">${h(p.category)} ${p.isDemo?' · HIPÓTESIS DEMO':''}</div><h1>${h(p.name)}</h1><p>${h(p.problem||'Sin problema registrado. Especifica a quién ayuda y cómo.')}</p></div>${productTag(p)}</div><div class="detail-actions"><button class="primary-button" data-edit="${h(p.id)}">Editar oportunidad ${svg('ic-arrow')}</button><a class="ghost-button" href="${metaSearchUrl(p.name)}" target="_blank" rel="noopener noreferrer">Anuncios Meta ${svg('ic-external')}</a>${safeUrl(p.sourceUrl)?`<a class="ghost-button" href="${h(safeUrl(p.sourceUrl))}" target="_blank" rel="noopener noreferrer">Proveedor ${svg('ic-external')}</a>`:''}</div><div class="detail-kpis"><div class="detail-kpi"><small>PRECIO ESTIMADO</small><strong>${CLP(e.price)}</strong></div><div class="detail-kpi"><small>COSTO PROVEEDOR</small><strong>${CLP(e.cost)}</strong></div><div class="detail-kpi"><small>CPA MÁX. DE EQUILIBRIO*</small><strong>${CLP(e.limitCPA)}</strong></div></div><div class="section-label" style="margin-top:25px">HIPÓTESIS Y FUENTES</div><div class="info-card"><strong>Notas de validación:</strong><div style="margin-top:7px">${h(p.notes||'No hay notas de investigación.')}</div></div><div style="margin-top:20px;line-height:2.2;font-size:11px;color:#9eb2c0"><div><strong>SKU / referencia:</strong> ${h(p.sku||'No registrado')}</div><div><strong>Fuente:</strong> ${h(p.source||'Manual')}</div><div><strong>Actualizado:</strong> ${h(p.updatedAt||'Sin fecha')}</div>${p.adUrl&&safeUrl(p.adUrl)?`<div><a class="text-link" target="_blank" rel="noopener noreferrer" href="${h(safeUrl(p.adUrl))}">Anuncio registrado ↗</a></div>`:''}${p.competitorUrl&&safeUrl(p.competitorUrl)?`<div><a class="text-link" target="_blank" rel="noopener noreferrer" href="${h(safeUrl(p.competitorUrl))}">Competidor registrado ↗</a></div>`:''}</div><div class="risk-note">* El CPA de equilibrio no equivale a un presupuesto publicitario recomendable. No contempla gastos no ingresados, IVA, impuesto a la renta ni cargos bancarios adicionales.</div><button class="ghost-button destructive" data-delete="${h(p.id)}" style="margin-top:19px">${svg('ic-trash')} Eliminar del radar</button></div></section><div style="display:flex;flex-direction:column;gap:16px"><section class="panel"><div class="panel-head"><div><h2>Economía unitaria</h2><p>Pesos chilenos · cálculo local</p></div></div><div class="panel-body"><div class="eco-list"><div class="eco-row"><span>Precio de venta</span><strong>${CLP(e.price)}</strong></div><div class="eco-row"><span>Proveedor</span><strong>− ${CLP(e.cost)}</strong></div><div class="eco-row"><span>Despacho</span><strong>− ${CLP(e.shipping)}</strong></div><div class="eco-row"><span>Comisiones</span><strong>− ${CLP(e.fee)}</strong></div><div class="eco-row"><span>Publicidad / pedido</span><strong>− ${CLP(e.cpa)}</strong></div><div class="eco-row"><span>Riesgo esperado rechazo</span><strong>− ${CLP(e.expectedRejectCost)}</strong></div><div class="eco-row"><span>Reserva impuestos manual</span><strong>− ${CLP(e.taxReserve)}</strong></div><div class="eco-row total"><span>Saldo estimado</span><strong style="color:${e.contribution<0?'var(--red)':'var(--green)'}">${CLP(e.contribution)}</strong></div></div><div class="risk-note">Precio y costos deben actualizarse por región. El riesgo de rechazo es un supuesto: ${fmtPct(e.rejectRate)} × ${CLP(e.rejectCost)}.</div></div></section><section class="panel"><div class="panel-head"><div><h2>Radar Score</h2><p>Heurística; no probabilidad de éxito</p></div><span class="chip">${p.metrics.verdict}</span></div><div class="panel-body"><div class="score-big">${p.metrics.score}<small> /100</small></div><p style="font-size:10px;color:#8fa5b4">Nivel de evidencia: ${p.metrics.confidence}% (${p.evidence}/5)</p>${breakdown.map(([name,score,max])=>`<div><div class="progress-line"><span>${name}</span><strong>${score}/${max}</strong></div><div class="progress"><span style="width:${Math.round(score/max*100)}%"></span></div></div>`).join('')}<div class="disclaimer">Una evidencia baja reduce deliberadamente el score. Registra visitas, cotizaciones, pedidos entregados y márgenes verificables.</div></div></section></div></div>`;}

function storesView(){return header('MARKET INTEL / STORES','Observatorio de competencia','Comparar precios y argumentos públicos, sin inventar estimaciones de ventas.')+`<div class="source-cards"><div class="source-card"><span class="source-logo">${svg('ic-search')}</span><h3>Google Shopping / búsqueda</h3><p>Descubre ofertas chilenas y cotiza precios con despacho, stock, garantías y diferenciadores.</p><a href="https://www.google.com/search?tbm=shop&q=productos+gimnasio+Chile" target="_blank" rel="noopener noreferrer">Explorar comercio ↗</a></div><div class="source-card"><span class="source-logo">${svg('ic-layers')}</span><h3>Tiendas de competidores</h3><p>Registra URL, argumentos y promociones en cada ficha. Nunca asumimos que una tienda publica unidades vendidas.</p><button class="primary-link" data-nav="products">Ver productos ${svg('ic-arrow')}</button></div><div class="source-card"><span class="source-logo">${svg('ic-shield')}</span><h3>Investigación responsable</h3><p>No eludimos bloqueos, sesiones privadas, robots, ni restricciones de redistribución. Separamos observaciones de estimaciones.</p><button class="primary-link" data-nav="settings">Ver limitaciones ${svg('ic-arrow')}</button></div></div><div class="panel" style="margin-top:18px"><div class="panel-head"><div><h2>Ficha comparativa por producto</h2><p>Busca alternativas y registra enlaces que puedas verificar</p></div></div>${tableLinks('stores')}</div>`;}
function playbook(){let top=ranked()[0];return header('LAB / LAUNCH ENGINE','Laboratorio de validación','Antes de pagar anuncios, comprueba que los números cierren y exista intención de compra.')+`<div class="detail-grid"><section class="panel"><div class="panel-head"><div><h2>Protocolo de lanzamiento en 5 pasos</h2><p>Diseñado para capital limitado</p></div><span class="chip">SIN SUSCRIPCIONES</span></div><div class="panel-body"><div class="step-list">${[['Problema concreto','Define comprador, contexto y frustración. Evita categorías genéricas.'],['Demanda observable','Revisa anuncios, competencia y conversaciones reales. Registra URLs, fechas y dudas.'],['Proveedor verificado','En Dropi confirma costo, stock, tiempos, devoluciones y flete por región.'],['Economía unitaria','Define costo por venta entregada, pérdidas por rechazos y umbral máximo de adquisición.'],['Prueba orgánica','Crea una oferta original, publica contenido verdadero y consigue conversaciones calificadas antes de gastar.']].map(([t,d],i)=>`<div class="step-item"><div class="step-num">${String(i+1).padStart(2,'0')}</div><div><strong>${t}</strong><p>${d}</p></div></div>`).join('')}</div></div></section><section class="panel"><div class="panel-head"><div><h2>Capital y decisiones</h2><p>Reglas conservadoras para tu prueba</p></div></div><div class="panel-body"><div class="split-tiles"><div class="split-tile"><small>CAPITAL INICIAL</small><strong>${CLP(db.settings.budget)}</strong></div><div class="split-tile"><small>SALDO OBJETIVO / PEDIDO</small><strong>${CLP(db.settings.targetContribution)}</strong></div></div><div class="section-label" style="margin-top:24px">CANDIDATO PRINCIPAL</div>${top?`<div class="info-card"><strong>${h(top.name)}</strong><br>Score: ${top.metrics.score}/100 · Saldo estimado: ${CLP(top.metrics.economics.contribution)}<br><br><span style="color:#89aa9d">No se considera ganador hasta verificar ventas efectivamente entregadas.</span></div><button class="ghost-button" style="margin-top:12px" data-detail="${h(top.id)}">Ver economía unitaria ${svg('ic-arrow')}</button>`:'<p>Registra un producto para iniciar.</p>'}<div class="risk-note">El dropshipping puede exigir saldo de billetera, pagos anticipados y absorción de devoluciones. No comprometas todo el presupuesto sin revisar las condiciones de tu proveedor.</div></div></section></div>`;}
function settingsView(){return header('SYSTEM / CONTROL','Centro de configuración','Tus datos se guardan en este navegador. Puedes exportarlos o restaurarlos cuando quieras.')+`<div class="detail-grid"><div class="panel"><div class="panel-head"><div><h2>Parámetros de decisión</h2><p>Valores para filtrar oportunidades y controlar riesgo</p></div></div><div class="panel-body"><div class="form-row"><div class="form-field"><label for="budget">Capital disponible (CLP)</label><input type="number" id="budget" min="0" step="1000" value="${h(db.settings.budget)}"></div><div class="form-field"><label for="targetContribution">Saldo objetivo por pedido (CLP)</label><input type="number" id="targetContribution" min="0" step="1000" value="${h(db.settings.targetContribution)}"></div></div><button class="primary-button" data-action="save-settings">Guardar parámetros</button><div class="section-label" style="margin-top:30px">COPIAS Y MOVILIDAD</div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="ghost-button" data-action="export-csv">${svg('ic-download')} Exportar CSV</button><button class="ghost-button" data-action="export-json">${svg('ic-download')} Copia JSON</button><button class="ghost-button" data-action="import">Importar datos</button></div><p class="notice">El CSV permite agregar productos con columnas <code>nombre,costo,precio,envio,comision,categoria</code> o importar una exportación del propio radar. El JSON restaura una copia completa.</p><div class="section-label" style="margin-top:29px">REINICIAR</div><button class="ghost-button destructive" data-action="reset">${svg('ic-trash')} Restablecer datos de ejemplo</button></div></div><div class="panel"><div class="panel-head"><div><h2>Origen, verificación y límites</h2><p>Arquitectura independiente — v${VERSION}</p></div></div><div class="panel-body"><div class="signal-items"><div class="signal"><div class="signal-icon">${svg('ic-shield')}</div><div><strong>Datos bajo tu control</strong><p>Los productos, notas y costos están en localStorage. Sin backend, sin sincronización entre dispositivos y sin cuentas externas.</p></div></div><div class="signal"><div class="signal-icon orange">${svg('ic-alert')}</div><div><strong>No hay feed privado de Dropi</strong><p>La fuente directa es tu cuenta Dropi. El sistema acepta registros manuales y CSV que exportes legítimamente.</p></div></div><div class="signal"><div class="signal-icon blue">${svg('ic-chart')}</div><div><strong>Scores explicables</strong><p>La fórmula está publicada en el código. Ni el score ni la longevidad de un anuncio equivalen a ventas.</p></div></div></div><div class="disclaimer">Conserva respaldos periódicos. Para manejar múltiples usuarios y datos empresariales se necesita autenticación y base de datos con controles de acceso.</div><div style="margin-top:17px"><a class="text-link" href="https://www.facebook.com/ads/library/api/" target="_blank" rel="noopener noreferrer">Alcance API oficial Meta ↗</a><br><br><a class="text-link" href="https://www.dropkiller.com/terms-and-conditions" target="_blank" rel="noopener noreferrer">Términos Dropkiller ↗</a></div></div></div></div>`;}
function render(){renderNav();$('#crumbName').textContent=MENU.find(([id])=>id===state.page)?.[1]||'Ficha de producto';$('#view').innerHTML=state.selected?detail(db.products.find(p=>p.id===state.selected)):({radar:overview,products:productExplorer,ads:adsView,stores:storesView,playbook,settings:settingsView}[state.page]||overview)();}
const fields=[{key:'name',label:'Nombre del producto',required:true,wide:true},{key:'problem',label:'Problema específico que resuelve',wide:true},{key:'category',label:'Categoría'},{key:'sku',label:'ID Dropi / SKU'},{key:'cost',label:'Costo de proveedor (CLP)',type:'number'},{key:'price',label:'Precio objetivo de venta (CLP)',type:'number'},{key:'shipping',label:'Flete por venta (CLP)',type:'number'},{key:'fee',label:'Comisión y pago (CLP)',type:'number'},{key:'cpa',label:'Publicidad por venta entregada (CLP)',type:'number'},{key:'taxReserve',label:'Reserva tributaria calculada por ti (CLP)',type:'number'},{key:'rejectRate',label:'Tasa de rechazo estimada (%)',type:'number',max:100},{key:'rejectCost',label:'Costo de un pedido rechazado (CLP)',type:'number'},{key:'demand',label:'Evidencia de demanda (0–5)',type:'number',max:5},{key:'pain',label:'Especificidad del problema (0–5)',type:'number',max:5},{key:'competition',label:'Competencia favorable (0–5)',type:'number',max:5},{key:'logistics',label:'Logística favorable (0–5)',type:'number',max:5},{key:'evidence',label:'Confianza de las fuentes (0–5)',type:'number',max:5},{key:'status',label:'Etapa',type:'status'},{key:'source',label:'Proveedor o fuente'},{key:'sourceUrl',label:'Enlace del proveedor',wide:true,type:'url'},{key:'adUrl',label:'Enlace de anuncio comprobado',wide:true,type:'url'},{key:'competitorUrl',label:'Enlace de competidor',wide:true,type:'url'},{key:'notes',label:'Notas y evidencias (incluye fechas)',wide:true,type:'textarea'}];
function openModal(id=null){state.modalId=id;const p=id?db.products.find(x=>x.id===id):blankProduct();if(!p)return;$('#modalTitle').textContent=id?'Editar oportunidad':'Nueva oportunidad';const groups=[[0,4,'IDENTIDAD Y PROBLEMA'],[4,12,'COSTOS Y RIESGOS'],[12,18,'EVIDENCIA Y CLASIFICACIÓN'],[18,23,'FUENTES Y NOTAS']];$('#formBody').innerHTML=groups.map(([from,to,title])=>`<div class="section-label">${title}</div><div class="form-row">${fields.slice(from,to).map(f=>`<div class="form-field ${f.wide?'wide':''}"><label for="f-${f.key}">${f.label}</label>${f.type==='textarea'?`<textarea id="f-${f.key}" name="${f.key}" maxlength="3000">${h(p[f.key])}</textarea>`:f.type==='status'?`<select id="f-status" name="status">${STATUSES.map(([id,label])=>`<option value="${id}" ${p.status===id?'selected':''}>${label}</option>`).join('')}</select>`:`<input id="f-${f.key}" name="${f.key}" type="${f.type||'text'}" ${f.required?'required':''} ${f.type==='number'?`min="0" max="${f.max||100000000}" step="1"`:''} maxlength="300" value="${h(p[f.key])}" />`}</div>`).join('')}</div>`).join('');$('#modal').classList.remove('hidden');$('#f-name')?.focus();}
function closeModal(){$('#modal').classList.add('hidden');state.modalId=null;}
function persistForm(){const old=state.modalId?db.products.find(x=>x.id===state.modalId):null;const p={...(old||blankProduct())};const data=new FormData($('#productForm'));for(const f of fields){let v=String(data.get(f.key)||'').trim();if(f.type==='number')p[f.key]=f.max===5?clamp(v,0,5):f.max===100?clamp(v,0,100):asMoney(v);else if(f.type==='url')p[f.key]=safeUrl(v);else p[f.key]=v.slice(0,f.key==='notes'?3000:300);}p.isDemo=false;p.updatedAt=new Date().toISOString().slice(0,10);if(!p.name){toast('Ingresa el nombre del producto');return;}if(old){db.products=db.products.map(x=>x.id===old.id?p:x);}else db.products.unshift(p);save();closeModal();state.selected=p.id;state.page='products';render();toast('Producto guardado en este navegador');}
function download(content,name,type){const file=new Blob([content],{type});const href=URL.createObjectURL(file);const a=document.createElement('a');a.href=href;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),2000);}
function exportData(format){const stamp=new Date().toISOString().slice(0,10);if(format==='json')download(JSON.stringify({version:VERSION,exportedAt:new Date().toISOString(),...db},null,2),`deep-radar-${stamp}.json`,'application/json');else download(exportCSV(db.products),`deep-radar-${stamp}.csv`,'text/csv;charset=utf-8');toast('Exportación creada');}
async function readImport(file){if(!file)return;try{if(file.size>2_000_000)throw Error('Archivo demasiado grande (máximo 2 MB)');const text=await file.text();if(file.name.toLowerCase().endsWith('.json')){const parsed=JSON.parse(text);if(!Array.isArray(parsed.products)||!parsed.settings)throw Error('Copia JSON inválida');if(!confirm('Esto reemplazará los productos y ajustes actuales. ¿Continuar?'))return;db={products:parsed.products.slice(0,3000).map(p=>({...blankProduct(),...p,id:String(p.id||blankProduct().id),name:String(p.name||'').slice(0,150),sourceUrl:safeUrl(p.sourceUrl),adUrl:safeUrl(p.adUrl),competitorUrl:safeUrl(p.competitorUrl)})),settings:{...DEFAULT_SETTINGS,...parsed.settings}};}else{const list=importCSV(text);if(!confirm(`Se añadirán ${list.length} productos al radar. ¿Continuar?`))return;db.products=[...list,...db.products].slice(0,3000);}save();setPage('products');toast('Importación completada');}catch(err){toast('No se pudo importar: '+err.message);}finally{$('#importInput').value='';}}
function clickHandler(event){const btn=event.target.closest('[data-nav],[data-detail],[data-edit],[data-delete],[data-action]');if(!btn)return;if(btn.dataset.edit){event.stopPropagation();openModal(btn.dataset.edit);return;}if(btn.dataset.delete){event.stopPropagation();const item=db.products.find(p=>p.id===btn.dataset.delete);if(item&&confirm(`¿Eliminar "${item.name}" del radar?`)){db.products=db.products.filter(p=>p.id!==item.id);save();state.selected=null;render();toast('Producto eliminado');}return;}if(btn.dataset.detail){state.selected=btn.dataset.detail;state.page='products';render();window.scrollTo(0,0);return;}if(btn.dataset.nav){setPage(btn.dataset.nav);window.scrollTo(0,0);return;}switch(btn.dataset.action){case 'reset':if(confirm('Se perderán los datos locales no exportados. ¿Restablecer ejemplos?')){db=initial();save();state.selected=null;render();toast('Ejemplos restaurados');}break;case 'import':$('#importInput').click();break;case 'export-csv':exportData('csv');break;case 'export-json':exportData('json');break;case 'save-settings':db.settings.budget=asMoney($('#budget').value);db.settings.targetContribution=asMoney($('#targetContribution').value);save();render();toast('Parámetros guardados');break;}}
document.addEventListener('click',clickHandler);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').classList.contains('hidden'))closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-detail]')){e.preventDefault();e.target.click();}});
document.addEventListener('input',e=>{if(e.target.id==='searchProducts'){state.search=e.target.value;$('#productsTable').innerHTML=table(filtered());$('#resultCount').textContent=filtered().length;}});
document.addEventListener('change',e=>{if(e.target.id==='filterCat'){state.category=e.target.value;$('#productsTable').innerHTML=table(filtered());$('#resultCount').textContent=filtered().length;}else if(e.target.id==='filterStatus'){state.status=e.target.value;$('#productsTable').innerHTML=table(filtered());$('#resultCount').textContent=filtered().length;}else if(e.target.id==='sortProducts'){state.sort=e.target.value;$('#productsTable').innerHTML=table(filtered());}else if(e.target.id==='importInput')readImport(e.target.files?.[0]);});
$('#newBtn').addEventListener('click',()=>openModal());$('#exportBtn').addEventListener('click',()=>exportData('csv'));$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#closeModal').addEventListener('click',closeModal);$('#cancelModal').addEventListener('click',closeModal);$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});$('#productForm').addEventListener('submit',e=>{e.preventDefault();persistForm();});render();
</script></body></html>
