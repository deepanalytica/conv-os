<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1100" viewBox="0 0 920 1100" role="img" aria-labelledby="title desc">
<title id="title">Ilustración conceptual de un bolso magnético negro sobre un rack metálico</title><desc id="desc">Representación artística para diseño de la tienda, no fotografía ni ficha exacta del modelo Dropi.</desc>
<defs>
 <linearGradient id="post" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7f8586"/><stop offset=".1" stop-color="#474e50"/><stop offset=".45" stop-color="#272b2b"/><stop offset=".8" stop-color="#46494a"/><stop offset="1" stop-color="#111514"/></linearGradient>
 <linearGradient id="main" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#464747"/><stop offset=".25" stop-color="#272929"/><stop offset=".75" stop-color="#101313"/><stop offset="1" stop-color="#070909"/></linearGradient>
 <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#101312"/><stop offset=".65" stop-color="#383a39"/><stop offset="1" stop-color="#0e1111"/></linearGradient>
 <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#969fa0"/><stop offset=".2" stop-color="#53585a"/><stop offset=".55" stop-color="#2b3031"/><stop offset=".9" stop-color="#818789"/><stop offset="1" stop-color="#242728"/></linearGradient>
 <linearGradient id="mesh" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#282c2b"/><stop offset=".6" stop-color="#131717"/><stop offset="1" stop-color="#313735"/></linearGradient>
 <linearGradient id="pocket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#313535"/><stop offset="1" stop-color="#090c0c"/></linearGradient>
 <pattern id="weave" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0l7 7M-2 5l2 2M5 -2l2 2" fill="none" stroke="#9da29c" stroke-opacity=".12" stroke-width=".75"/></pattern>
 <pattern id="net" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 0l12 12M12 0L0 12" stroke="#9da39f" stroke-opacity=".26" stroke-width=".8"/></pattern>
 <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="15"/></filter>
